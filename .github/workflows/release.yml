name: Release CLI binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not publish a release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: patchfly-linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            asset: patchfly-linux-arm64
          - os: macos-13
            label: macos-x64
            asset: patchfly-macos-x64
          - os: macos-14
            label: macos-arm64
            asset: patchfly-macos-arm64
          - os: windows-latest
            label: windows-x64
            asset: patchfly-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: stable

      - name: Install dependencies
        working-directory: cli
        run: dart pub get

      - name: Build CLI
        working-directory: cli
        run: dart compile exe bin/patchfly.dart -o ${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Generate SHA-256
        id: sha
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.exe").Hash.ToLower()
            "$hash  ${{ matrix.asset }}.exe" | Out-File -FilePath "${{ matrix.asset }}.exe.sha256" -Encoding ASCII
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            cli/${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            cli/${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact dir
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
          repository: fatmuh/patchfly-cli-binaries
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/patchfly-linux-x64
            dist/patchfly-linux-x64.sha256
            dist/patchfly-linux-arm64
            dist/patchfly-linux-arm64.sha256
            dist/patchfly-macos-x64
            dist/patchfly-macos-x64.sha256
            dist/patchfly-macos-arm64
            dist/patchfly-macos-arm64.sha256
            dist/patchfly-windows-x64.exe
            dist/patchfly-windows-x64.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
