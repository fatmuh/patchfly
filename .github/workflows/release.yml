name: Release CLI binaries to S3/R2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0). Defaults to tag name.'
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: patchfly-linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            asset: patchfly-linux-arm64
          - os: macos-14
            label: macos-x64
            asset: patchfly-macos-x64
          - os: macos-14
            label: macos-arm64
            asset: patchfly-macos-arm64
          - os: windows-latest
            label: windows-x64
            asset: patchfly-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: stable

      - name: Install dependencies
        working-directory: cli
        run: dart pub get

      - name: Install x64 Dart (for macos-x64 cross-build)
        if: matrix.label == 'macos-x64'
        # The dart-lang/setup-dart installs arm64 dart on macos-14 runner.
        # To compile an x64 binary, we need the x64 dart SDK. Download it
        # manually to /tmp/dart-sdk/ and run it via Rosetta 2.
        run: |
          echo "Downloading x64 Dart SDK..."
          curl -fsSL https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-macos-x64-release.zip -o /tmp/dartsdk-x64.zip
          unzip -q -o /tmp/dartsdk-x64.zip -d /tmp/
          echo "Verifying x64 dart binary:"
          file /tmp/dart-sdk/bin/dart
          /tmp/dart-sdk/bin/dart --version

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # Match the logic in the publish job so the binary's reported
          # version always matches the release tag (e.g. v0.0.2).
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="v${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            echo "::error::No version provided and no v* tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build CLI
        working-directory: cli
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          # Strip the 'v' prefix for the dart compile define.
          # This MUST match the tag (e.g. tag v0.1.0 → --define=VERSION=0.1.0)
          # so the binary's reported version matches the release.
          DART_VERSION="${VERSION#v}"
          echo "DART_VERSION=[$DART_VERSION] (env VERSION was [$VERSION])"
          if [ "${{ matrix.label }}" = "macos-x64" ]; then
            arch -x86_64 /tmp/dart-sdk/bin/dart compile exe --define=VERSION=$DART_VERSION bin/patchfly.dart -o ${{ matrix.asset }}
          else
            dart compile exe --define=VERSION=$DART_VERSION bin/patchfly.dart -o ${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          fi
          # Debug: confirm the version got embedded
          BINARY="${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          echo "Binary size: $(wc -c < $BINARY)"
          echo "--- strings | grep 'patchfly 0' (first 5) ---"
          strings "$BINARY" 2>/dev/null | grep 'patchfly 0' | head -5 || echo "(no matches)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    name: Upload to S3/R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          # VERSION is the FULL path segment including 'v' prefix
          # (e.g. v0.0.1). This matches install scripts which build
          # download URLs as cli/v${VERSION}/...
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="v${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            echo "::error::No version provided and no v* tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Merge-multiple puts all artifact files directly in dist/
          # (no per-artifact subdirectories), so we don't need to flatten.
          merge-multiple: true

      - name: Generate SHA-256 for all binaries
        # Done once on the publish job (Ubuntu) — avoids per-OS shell
        # portability issues with shasum/sha256sum/Get-FileHash.
        # Outputs:
        #   dist/<binary>.sha256   (per-file)
        #   dist/SHA256SUMS        (combined manifest)
        run: |
          cd dist
          echo "=== Files in dist/ ==="
          ls -la
          echo ""
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum * > SHA256SUMS
          echo "=== Generated checksums ==="
          cat SHA256SUMS

      - name: Set AWS credentials
        # IDCloudHost S3 has no STS endpoint, so we can't use
        # aws-actions/configure-aws-credentials (it validates via STS).
        # Set env vars directly instead. Region is just a placeholder for
        # AWS CLI sanity; the actual S3 calls use --endpoint-url below.
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"
          # Mask in logs (just in case)
          echo "::add-mask::${{ secrets.AWS_ACCESS_KEY_ID }}" || true
          echo "::add-mask::${{ secrets.AWS_SECRET_ACCESS_KEY }}" || true

      - name: Configure AWS CLI signature version
        # IDCloudHost S3 requires legacy 's3' (SigV2) for object uploads.
        # Modern 's3v4' returns 'MissingContentLength' error.
        # For R2/AWS S3/MinIO, this is a no-op (v4 is default elsewhere).
        run: aws configure set default.s3.signature_version s3

      - name: Upload to S3 (versioned path)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PUBACL: ${{ vars.S3_PUBLIC_ACL || 'public-read' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          # Build --endpoint-url flag for non-AWS S3 (R2, MinIO, B2, IDCloudHost, etc.)
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          # Normalize prefix (no leading/trailing slash, with trailing /)
          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi

          # Per-file upload: 'aws s3 cp --recursive' on IDCloudHost doesn't
          # apply --acl to each object, leaving them private. Iterate manually.
          echo "Uploading to s3://$S3_BUCKET/${PREFIX}cli/$VERSION/ ..."
          for f in dist/*; do
            aws s3 cp "$f" "s3://$S3_BUCKET/${PREFIX}cli/$VERSION/$(basename $f)" \
              $ENDPOINT_FLAG \
              --acl "$S3_PUBACL" \
              --cache-control "public, max-age=3600"
          done

      - name: Mirror to cli/latest/
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PUBACL: ${{ vars.S3_PUBLIC_ACL || 'public-read' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi

          # Delete old latest/ then re-upload (so it always points to the newest)
          echo "Refreshing s3://$S3_BUCKET/${PREFIX}cli/latest/ ..."
          aws s3 rm "s3://$S3_BUCKET/${PREFIX}cli/latest/" \
            $ENDPOINT_FLAG --recursive || true
          for f in dist/*; do
            aws s3 cp "$f" "s3://$S3_BUCKET/${PREFIX}cli/latest/$(basename $f)" \
              $ENDPOINT_FLAG \
              --acl "$S3_PUBACL" \
              --cache-control "public, max-age=300"
          done

      - name: Summary
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi
          echo ""
          echo "============================================"
          echo "  Published v$VERSION to S3"
          echo "============================================"
          echo "Bucket: s3://$S3_BUCKET/${PREFIX}cli/$VERSION/"
          if [ -n "$S3_PUBLIC_URL" ]; then
            echo "Public URL: $S3_PUBLIC_URL/cli/$VERSION/"
            echo "Latest URL: $S3_PUBLIC_URL/cli/latest/"
          fi
          echo "============================================"
          echo ""
          echo "Test install:"
          echo "  PATCHFLY_BINARY_URL='$S3_PUBLIC_URL' \\"
          echo "    curl -sSf https://raw.githubusercontent.com/fatmuh/patchfly-install/main/install.sh | bash"
          echo "============================================"
