name: Release CLI binaries to S3/R2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0). Defaults to tag name.'
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: patchfly-linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
            asset: patchfly-linux-arm64
          - os: macos-13
            label: macos-x64
            asset: patchfly-macos-x64
          - os: macos-14
            label: macos-arm64
            asset: patchfly-macos-arm64
          - os: windows-latest
            label: windows-x64
            asset: patchfly-windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          version: stable

      - name: Install dependencies
        working-directory: cli
        run: dart pub get

      - name: Build CLI
        working-directory: cli
        run: dart compile exe bin/patchfly.dart -o ${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Generate SHA-256
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset }}.exe").Hash.ToLower()
            "$hash  ${{ matrix.asset }}.exe" | Out-File -FilePath "${{ matrix.asset }}.exe.sha256" -Encoding ASCII
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            cli/${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}
            cli/${{ matrix.asset }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}.sha256
          if-no-files-found: error

  publish:
    name: Upload to S3/R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::No version provided and no v* tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact dir
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION || 'auto' }}

      - name: Upload to S3 (versioned path)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PUBACL: ${{ vars.S3_PUBLIC_ACL || 'public-read' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          # Build --endpoint-url flag for non-AWS S3 (R2, MinIO, B2, IDCloudHost, etc.)
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          # Normalize prefix (no leading/trailing slash, with trailing /)
          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi

          echo "Uploading to s3://$S3_BUCKET/${PREFIX}cli/$VERSION/ ..."
          aws s3 cp dist/ "s3://$S3_BUCKET/${PREFIX}cli/$VERSION/" \
            $ENDPOINT_FLAG \
            --recursive \
            --acl "$S3_PUBACL" \
            --cache-control "public, max-age=3600"

      - name: Mirror to cli/latest/
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PUBACL: ${{ vars.S3_PUBLIC_ACL || 'public-read' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          ENDPOINT_FLAG=""
          if [ -n "$S3_ENDPOINT" ]; then
            ENDPOINT_FLAG="--endpoint-url $S3_ENDPOINT"
          fi

          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi

          # Delete old latest/ then re-upload (so it always points to the newest)
          echo "Refreshing s3://$S3_BUCKET/${PREFIX}cli/latest/ ..."
          aws s3 rm "s3://$S3_BUCKET/${PREFIX}cli/latest/" \
            $ENDPOINT_FLAG --recursive || true
          for f in dist/*; do
            aws s3 cp "$f" "s3://$S3_BUCKET/${PREFIX}cli/latest/$(basename $f)" \
              $ENDPOINT_FLAG \
              --acl "$S3_PUBACL" \
              --cache-control "public, max-age=300"
          done

      - name: Summary
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || 'patchfly-cli' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || '' }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PREFIX=""
          if [ -n "$S3_PREFIX" ]; then
            PREFIX="$(echo "$S3_PREFIX" | sed 's#^/##;s#/$##')/"
          fi
          echo ""
          echo "============================================"
          echo "  Published v$VERSION to S3"
          echo "============================================"
          echo "Bucket: s3://$S3_BUCKET/${PREFIX}cli/$VERSION/"
          if [ -n "$S3_PUBLIC_URL" ]; then
            echo "Public URL: $S3_PUBLIC_URL/cli/$VERSION/"
            echo "Latest URL: $S3_PUBLIC_URL/cli/latest/"
          fi
          echo "============================================"
          echo ""
          echo "Test install:"
          echo "  PATCHFLY_BINARY_URL='$S3_PUBLIC_URL' \\"
          echo "    curl -sSf https://raw.githubusercontent.com/fatmuh/patchfly-install/main/install.sh | bash"
          echo "============================================"
